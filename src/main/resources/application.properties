# ==============================
# Application
# ==============================
spring.application.name=PersonalBlog
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8080}
server.address=${SERVER_ADDRESS:0.0.0.0}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Trust X-Forwarded-* headers from the platform/reverse proxy.
server.forward-headers-strategy=framework


# ==============================
# Web
# ==============================
spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

spring.thymeleaf.cache=${THYMELEAF_CACHE:true}
spring.web.resources.chain.cache=true
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
spring.web.resources.cache.cachecontrol.max-age=365d
spring.web.resources.cache.cachecontrol.cache-public=true

server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,image/svg+xml
server.compression.min-response-size=2KB

server.error.whitelabel.enabled=false
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false


# ==============================
# Site identity
# ==============================
blog.site.name=${SITE_NAME:Personal Blog}
blog.site.description=${SITE_DESCRIPTION:Notes and articles on software development.}
blog.site.author=${SITE_AUTHOR:Julia Walker}
blog.site.author-role=${SITE_AUTHOR_ROLE:Web Developer}
blog.site.tagline=${SITE_TAGLINE:}
blog.site.hero-image=${SITE_HERO_IMAGE:/images/hero.png}
blog.site.author-avatar=${SITE_AUTHOR_AVATAR:/images/author.png}
blog.site.email=${SITE_EMAIL:}
blog.site.social.github=${SOCIAL_GITHUB:}
blog.site.social.facebook=${SOCIAL_FACEBOOK:}
blog.site.social.linkedin=${SOCIAL_LINKEDIN:}
blog.site.social.x=${SOCIAL_X:}


# ==============================
# Articles (filesystem storage)
# ==============================
blog.articles.directory=${ARTICLES_DIR:./data/articles}


# ==============================
# Security
# ==============================
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax

blog.admin.username=${ADMIN_USERNAME:}
blog.admin.password-hash=${ADMIN_PASSWORD_HASH:}
blog.admin.remember-me-key=${REMEMBER_ME_KEY:}


# ==============================
# Logging
# ==============================
logging.level.root=${LOGGING_LEVEL_ROOT:INFO}
logging.level.org.springframework.web=${LOGGING_LEVEL_WEB:INFO}
logging.level.org.springframework.security=${LOGGING_LEVEL_SECURITY:WARN}
