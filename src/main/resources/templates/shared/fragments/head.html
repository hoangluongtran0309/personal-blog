<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <th:block th:fragment="common-head">
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <meta name="description" th:if="${site != null}" th:content="${site.description}"/>
        <link rel="shortcut icon" th:href="@{/icons/favicon.ico}" type="image/x-icon"/>
        <script>
            (function () {
                try {
                    var theme = localStorage.getItem("theme");
                    if (theme === "dark" || (theme === null && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
                        document.documentElement.classList.add("dark");
                    }
                } catch (e) {
                }
            })();
        </script>
        <link th:href="@{/css/application.css}" rel="stylesheet"/>
        <link rel="preconnect" href="https://fonts.googleapis.com"/>
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap"
            rel="stylesheet"/>
        </th:block>
    </head>
    <body>
        <th:block th:fragment="common-scripts">
            <script th:src="@{/js/script.js}" defer></script>
            <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
            <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
        </th:block>
    </body>
</html>
