<!DOCTYPE html>
<html th:lang="${#locale.toLanguageTag()}"
    xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{client/layout/main}">
    <head>
        <title th:text="${article.title.asString()}"></title>
    </head>
    <body>
        <div layout:fragment="content">
            <th:block th:replace="~{client/fragments/details :: detailHero(${article})}"></th:block>
            <div class="bg-light-bg-secondary dark:bg-dark-bg-secondary transition-colors duration-300 py-16">
                <div class="container mx-auto px-4 sm:px-8 lg:px-8 max-w-[1150px] lg:grid lg:grid-cols-[1fr_300px] lg:gap-16">
                    <div class="min-w-0">
                        <th:block th:replace="~{client/fragments/details :: detailContent(${article}, ${contentHtml})}"></th:block>
                    </div>
                    <div>
                        <th:block th:replace="~{client/fragments/details :: detailSidebar(${article})}"></th:block>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
