<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <body>
        <th:block th:fragment="detailHero(article)">
            <div class="bg-light-bg-primary dark:bg-dark-bg-primary transition-colors duration-300 pt-6 pb-4">
                <div class="container mx-auto px-4 sm:px-8 lg:px-8 max-w-[1150px]">
                    <nav class="flex items-center gap-2 text-sm text-light-fg-tertiary dark:text-dark-fg-tertiary transition-colors duration-300 mb-8"
                        th:aria-label="#{breadcrumb}">
                        <a th:href="@{/}" class="hover:text-accent transition-colors duration-300" th:text="#{nav.home}"></a>
                        <th:block th:if="${article.category != null}">
                            <span aria-hidden="true">&rsaquo;</span>
                            <a th:href="@{/category/{slug}(slug=${article.category.slug.asString()})}"
                                th:text="${article.category.name}"
                                class="hover:text-accent transition-colors duration-300"></a>
                        </th:block>
                        <span aria-hidden="true">&rsaquo;</span>
                        <span th:text="${article.title.asString()}"
                            aria-current="page"
                            class="text-light-fg-secondary dark:text-dark-fg-secondary truncate max-w-[200px] sm:max-w-xs"></span>
                    </nav>
                    <div th:if="${article.category != null}" class="mb-4">
                        <a th:href="@{/category/{slug}(slug=${article.category.slug.asString()})}"
                            th:text="${article.category.name}"
                            class="inline-block px-4 py-1 rounded-full bg-accent text-white text-xs font-semibold uppercase tracking-wide hover:opacity-90 transition-opacity"></a>
                    </div>
                    <h1 th:text="${article.title.asString()}"
                        class="text-3xl sm:text-4xl lg:text-5xl font-black text-light-fg-primary dark:text-dark-fg-primary transition-colors duration-300 mb-5 leading-tight max-w-3xl">
                    </h1>
                    <div class="flex flex-wrap items-center gap-4 mb-6 text-sm text-light-fg-tertiary dark:text-dark-fg-tertiary transition-colors duration-300">
                        <div class="flex items-center gap-1.5">
                            <ion-icon name="calendar-outline" class="text-base text-accent" aria-hidden="true"></ion-icon>
                            <span th:text="#{published}" class="sr-only"></span>
                            <time th:datetime="${article.publishedAt}"
                                th:text="${#temporals.format(article.publishedAt, #messages.msg('date.format.long'))}">
                            </time>
                        </div>
                        <span aria-hidden="true">·</span>
                        <div class="flex items-center gap-1.5">
                            <ion-icon name="time-outline" class="text-base text-accent" aria-hidden="true"></ion-icon>
                            <span th:text="#{minRead(${article.readingMinutes})}"></span>
                        </div>
                        <span aria-hidden="true">·</span>
                        <div class="flex items-center gap-2">
                            <img th:src="@{${site?.authorAvatar}}" th:alt="${site?.author}" width="24" height="24" class="w-6 h-6 rounded-full"/>
                            <span th:text="${site?.author}" class="font-medium text-light-fg-secondary dark:text-dark-fg-secondary"></span>
                        </div>
                    </div>
                </div>
                <div th:if="${article.coverImage != null}" class="container mx-auto px-4 sm:px-8 lg:px-8 max-w-[1150px]">
                    <div class="w-full h-56 sm:h-80 lg:h-[420px] rounded-2xl overflow-hidden shadow-[0_10px_10px_hsla(0,0%,0%,0.05)]">
                        <img th:src="@{${article.coverImage.asString()}}" th:alt="${article.title.asString()}" class="w-full h-full object-cover"/>
                    </div>
                </div>
            </div>
        </th:block>
        <th:block th:fragment="detailContent(article, contentHtml)">
            <p th:if="${article.summary != null}"
                th:text="${article.summary.asString()}"
                class="text-xl text-light-fg-secondary dark:text-dark-fg-secondary transition-colors duration-300 leading-relaxed mb-10 font-medium border-l-4 border-accent pl-5 italic">
            </p>
            <!--/* contentHtml is sanitized by MarkdownService */-->
            <div th:utext="${contentHtml}"
                class="prose prose-neutral dark:prose-invert max-w-none
                prose-headings:font-bold
                prose-h2:text-2xl prose-h2:mt-10 prose-h2:mb-4
                prose-h3:text-xl prose-h3:mt-8 prose-h3:mb-3
                prose-p:leading-relaxed prose-p:mb-5
                prose-a:text-accent prose-a:no-underline hover:prose-a:opacity-80
                prose-code:bg-light-action-primary dark:prose-code:bg-dark-bg-primary
                prose-code:px-1.5 prose-code:py-0.5 prose-code:rounded prose-code:before:content-none prose-code:after:content-none
                prose-pre:bg-light-action-primary dark:prose-pre:bg-dark-bg-primary
                prose-pre:text-light-fg-primary dark:prose-pre:text-dark-fg-primary
                prose-pre:rounded-xl prose-pre:p-5
                prose-blockquote:border-l-4 prose-blockquote:border-accent
                prose-blockquote:not-italic prose-blockquote:pl-5
                prose-img:rounded-xl prose-img:w-full prose-img:object-cover
                prose-hr:border-light-action-primary dark:prose-hr:border-dark-action-primary prose-hr:my-10
                prose-th:bg-light-action-secondary dark:prose-th:bg-dark-action-secondary
                prose-td:border-b prose-td:border-light-action-primary dark:prose-td:border-dark-action-primary
                prose-li:marker:text-light-fg-secondary dark:prose-li:marker:text-dark-fg-secondary
                [&_pre_code]:p-0 [&_pre_code]:bg-transparent
                [&_:is(h1,h2,h3,h4,h5,h6)>a]:text-inherit [&_:is(h1,h2,h3,h4,h5,h6)>a:hover]:text-accent"></div>
            <div th:if="${!article.tags.isEmpty()}"
                class="mt-12 pt-8 border-t border-light-action-primary dark:border-dark-action-primary transition-colors duration-300">
                <div class="flex flex-wrap items-center gap-3">
                    <span class="text-sm font-semibold text-light-fg-secondary dark:text-dark-fg-secondary" th:text="#{tags}"></span>
                    <a th:each="tag : ${article.tags}"
                        th:href="@{/tag/{slug}(slug=${tag.slug.asString()})}"
                        th:text="|#${tag.name}|"
                        class="text-sm px-4 py-1.5 rounded-full bg-light-action-secondary dark:bg-dark-action-secondary text-light-fg-tertiary dark:text-dark-fg-tertiary hover:bg-accent hover:text-white transition-colors duration-300">
                    </a>
                </div>
            </div>
            <div class="mt-10">
                <a th:href="@{/}"
                    class="inline-flex items-center gap-2 px-5 py-2.5 bg-light-action-secondary dark:bg-dark-action-secondary text-light-fg-secondary dark:text-dark-fg-secondary border border-light-action-primary dark:border-dark-action-primary rounded-full hover:border-accent hover:text-accent transition-colors duration-300 text-sm font-medium">
                    <span aria-hidden="true">&larr;</span>
                    <span th:text="#{backToHome}"></span>
                </a>
            </div>
        </th:block>
        <th:block th:fragment="detailSidebar(article)">
            <aside class="mt-12 lg:mt-0 self-start lg:sticky lg:top-8 space-y-8">
                <div class="bg-light-bg-primary dark:bg-dark-bg-primary rounded-[10px] p-6 shadow-[0_5px_5px_hsla(0,0%,0%,0.05)] text-center">
                    <div class="w-20 h-20 mx-auto mb-3 p-[3px] rounded-full bg-light-action-primary dark:bg-dark-action-primary">
                        <img th:src="@{${site?.authorAvatar}}" th:alt="${site?.author}" width="74" height="74" class="w-full h-full rounded-full object-cover"/>
                    </div>
                    <p class="font-bold text-light-fg-primary dark:text-dark-fg-primary" th:text="${site?.author}"></p>
                    <p class="text-sm text-light-fg-secondary dark:text-dark-fg-secondary mb-4" th:text="${site?.authorRole}"></p>
                    <th:block th:replace="~{client/fragments/sidebar :: social-links}"></th:block>
                </div>
                <div class="bg-light-bg-primary dark:bg-dark-bg-primary transition-colors duration-300 rounded-[10px] p-6 shadow-[0_5px_5px_hsla(0,0%,0%,0.05)]">
                    <h2 th:text="#{articleInfo}" class="text-base font-bold text-light-fg-secondary dark:text-dark-fg-secondary mb-4"></h2>
                    <ul class="space-y-3 text-sm text-light-fg-secondary dark:text-dark-fg-secondary">
                        <li th:if="${article.category != null}" class="flex items-center gap-2">
                            <ion-icon name="folder-outline" class="text-accent flex-shrink-0" aria-hidden="true"></ion-icon>
                            <span th:text="#{topic}"></span>
                            <a th:href="@{/category/{slug}(slug=${article.category.slug.asString()})}"
                                th:text="${article.category.name}"
                                class="text-accent hover:underline font-medium"></a>
                        </li>
                        <li class="flex items-center gap-2">
                            <ion-icon name="calendar-outline" class="text-accent flex-shrink-0" aria-hidden="true"></ion-icon>
                            <span th:text="#{published}"></span>
                            <time th:datetime="${article.publishedAt}"
                                th:text="${#temporals.format(article.publishedAt, #messages.msg('date.format.short'))}"
                                class="font-medium"></time>
                        </li>
                        <li th:if="${article.updatedAt.isAfter(article.publishedAt)}" class="flex items-center gap-2">
                            <ion-icon name="create-outline" class="text-accent flex-shrink-0" aria-hidden="true"></ion-icon>
                            <span th:text="#{updated}"></span>
                            <time th:datetime="${article.updatedAt}"
                                th:text="${#temporals.format(article.updatedAt, #messages.msg('date.format.short'))}"
                                class="font-medium"></time>
                        </li>
                    </ul>
                </div>
            </aside>
        </th:block>
    </body>
</html>
