<!DOCTYPE html>
<html th:lang="${#locale.toLanguageTag()}"
    xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{admin/layout/main}">
    <head>
        <title th:text="#{article.delete}"></title>
    </head>
    <body>
        <th:block layout:fragment="content">
            <div class="max-w-xl mx-auto mt-6">
                <div class="bg-light-bg-primary dark:bg-dark-bg-primary rounded-xl shadow-sm border border-light-border dark:border-dark-border p-8 transition-colors duration-300">
                    <div class="w-14 h-14 rounded-full bg-red-100 dark:bg-red-500/10 text-red-500 flex items-center justify-center text-3xl mb-5" aria-hidden="true">
                        <ion-icon name="trash-outline"></ion-icon>
                    </div>
                    <h1 class="text-2xl font-bold mb-2" th:text="#{article.delete}"></h1>
                    <p class="text-light-fg-secondary dark:text-dark-fg-secondary mb-6" th:text="#{article.delete.confirm}"></p>
                    <dl class="rounded-lg bg-light-bg-secondary dark:bg-dark-bg-secondary p-4 mb-6 space-y-2 text-sm">
                        <div class="flex gap-2">
                            <dt class="text-light-fg-secondary dark:text-dark-fg-secondary" th:text="#{article.field.title}"></dt>
                            <dd class="font-semibold" th:text="${article.title.asString()}"></dd>
                        </div>
                        <div class="flex items-center gap-2">
                            <dt class="text-light-fg-secondary dark:text-dark-fg-secondary" th:text="#{article.field.status}"></dt>
                            <dd><th:block th:replace="~{admin/fragments/tables :: status-badge(${status})}"></th:block></dd>
                        </div>
                    </dl>
                    <form th:action="@{/admin/articles/{id}/delete(id=${article.id.asString()})}" method="post"
                        class="flex flex-col-reverse sm:flex-row sm:justify-end gap-3">
                        <a th:href="@{/admin}"
                            class="px-5 py-2.5 text-center rounded-full border border-light-action-primary dark:border-dark-action-primary text-sm font-medium hover:border-accent hover:text-accent transition-colors duration-300"
                            th:text="#{action.cancel}"></a>
                        <button type="submit"
                            class="px-5 py-2.5 rounded-full bg-red-500 text-white text-sm font-semibold hover:bg-red-600 transition-colors duration-300"
                            th:text="#{article.delete.submit}"></button>
                    </form>
                </div>
            </div>
        </th:block>
    </body>
</html>
