<!DOCTYPE html>
<html th:lang="${#locale.toLanguageTag()}"
    xmlns:th="http://www.thymeleaf.org">
    <head>
        <title th:text="|#{login.title} · ${site?.name}|"></title>
        <meta name="robots" content="noindex"/>
        <th:block th:replace="~{shared/fragments/head :: common-head}"></th:block>
    </head>
    <body class="bg-light-bg-secondary dark:bg-dark-bg-secondary text-light-fg-primary dark:text-dark-fg-primary transition-colors duration-300">
        <main class="min-h-screen flex items-center justify-center p-4">
            <div class="w-full max-w-md">
                <div class="bg-light-bg-primary dark:bg-dark-bg-primary rounded-2xl shadow-xl p-8 transition-colors duration-300">
                    <div class="text-center mb-8">
                        <div class="flex justify-center mb-4">
                            <a th:href="@{/}" th:title="${site?.name}">
                                <img th:src="@{/svg/logo-light.svg}" width="150" height="40" th:alt="${site?.name}" class="logo-light dark:hidden"/>
                                <img th:src="@{/svg/logo-dark.svg}" width="150" height="40" th:alt="${site?.name}" class="logo-dark hidden dark:block"/>
                            </a>
                        </div>
                        <h1 class="text-xl font-bold mb-2" th:text="#{login.title}"></h1>
                        <p class="text-light-fg-secondary dark:text-dark-fg-secondary" th:text="#{login.greeting}"></p>
                    </div>
                    <th:block th:replace="~{shared/fragments/alerts :: flashAlerts}"></th:block>
                    <form th:action="@{/login}" method="post" class="space-y-6">
                        <div>
                            <label for="username" class="block text-sm font-medium mb-2" th:text="#{login.username}"></label>
                            <input type="text" id="username" name="username" required autofocus
                                autocomplete="username"
                                th:placeholder="#{login.username.placeholder}"
                                class="w-full px-4 py-3 bg-light-action-secondary dark:bg-dark-action-secondary rounded-lg focus:outline-none focus:ring-2 focus:ring-accent transition-all duration-300"/>
                        </div>
                        <div>
                            <label for="password" class="block text-sm font-medium mb-2" th:text="#{login.password}"></label>
                            <input type="password" id="password" name="password" required
                                autocomplete="current-password"
                                placeholder="••••••••"
                                class="w-full px-4 py-3 bg-light-action-secondary dark:bg-dark-action-secondary rounded-lg focus:outline-none focus:ring-2 focus:ring-accent transition-all duration-300"/>
                        </div>
                        <label class="flex items-center cursor-pointer">
                            <input type="checkbox" id="rememberMe" name="remember-me"
                                class="w-4 h-4 accent-[hsl(229,76%,66%)] rounded"/>
                            <span class="ml-2 text-sm" th:text="#{login.rememberMe}"></span>
                        </label>
                        <th:block th:replace="~{shared/fragments/buttons :: submit-button(#{login.submit})}"></th:block>
                    </form>
                    <div class="mt-6 flex items-center justify-center gap-4">
                        <th:block th:replace="~{shared/fragments/buttons :: language-switch}"></th:block>
                        <th:block th:replace="~{shared/fragments/buttons :: theme-toggle-mobile}"></th:block>
                    </div>
                </div>
                <div class="text-center mt-6">
                    <th:block th:replace="~{shared/fragments/buttons :: nav-button(@{/}, #{returnToWebsite})}"></th:block>
                </div>
            </div>
        </main>
        <th:block th:replace="~{shared/fragments/head :: common-scripts}"></th:block>
    </body>
</html>
